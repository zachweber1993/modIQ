[workspace]
resolver = "2"

members = [
    "apps/console/src-tauri",
    "crates/modiq-cli",
    "crates/modiq-collection",
    "crates/modiq-engine",
    "crates/modiq-knowledge",
    "crates/modiq-report",
    "crates/modiq-rules",
    "crates/modiq-runtime",
    "crates/modiq-storage",
    "crates/modiq-versioning",
]

# `apps/console/src-tauri` is a real workspace member (unlike
# `apps/sandbox`, which deliberately is not — see its own Cargo.toml)
# because Initiative 5 named non-membership as one of three facts
# disqualifying a candidate from being the production interaction
# layer. `default-members` preserves plain `cargo check`/`build`/`test`
# behavior at exactly the original nine crates, so this membership
# does not pull Tauri's GUI dependency tree into that default set —
# only an explicit `--workspace` (or `-p console_lib`) invocation
# builds it. Verified in ENGINEERING_LOG-equivalent implementation
# notes at this Sprint's own closeout.
default-members = [
    "crates/modiq-cli",
    "crates/modiq-collection",
    "crates/modiq-engine",
    "crates/modiq-knowledge",
    "crates/modiq-report",
    "crates/modiq-rules",
    "crates/modiq-runtime",
    "crates/modiq-storage",
    "crates/modiq-versioning",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = "8"