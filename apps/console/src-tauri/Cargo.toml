[package]
name = "console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "modIQ Console — the production interaction layer FrontendArchitecture.md authorizes"
authors = ["modIQ"]

# A real member of the root workspace, unlike `apps/sandbox` (see its
# own Cargo.toml's `[workspace]` table and comment) — Initiative 5
# named non-membership as one of three facts disqualifying a candidate
# from being the production interaction layer. `default-members` in
# the root Cargo.toml keeps plain `cargo check`/`build`/`test`
# unaffected; only an explicit `--workspace` or `-p console_lib`
# invocation builds this crate.

[lib]
# The `_lib` suffix mirrors `apps/sandbox`'s own convention: needed to
# keep the lib name distinct from the bin name, primarily an issue on
# Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 2 (Sprint 21): the first real dependency on the engine. Scoped
# to exactly `execute_from_assessment_input`'s own requirements and
# confined entirely to `src/assessment.rs` — no other module in this
# crate may import any of the three. See that module's own doc
# comment and this crate's README for the Boundary Enforcement this
# confinement realizes.
modiq-runtime = { path = "../../../crates/modiq-runtime" }
modiq-engine = { path = "../../../crates/modiq-engine" }
modiq-report = { path = "../../../crates/modiq-report" }
